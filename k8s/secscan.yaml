apiVersion: apps/v1
kind: Deployment
metadata:
  name: secscan
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secscan
  template:
    metadata:
      labels:
        app: secscan
    spec:
      containers:
      - name: secscan
        image: docker.io/shreeshanth265/secscan:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: secscan
spec:
  type: NodePort
  selector:
    app: secscan
  ports:
  - port: 80
    targetPort: 5000
